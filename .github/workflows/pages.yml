name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Build playground (js)
        run: moon build --target js --release playground
      - name: Assemble Jekyll source
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp _build/js/release/build/playground/playground.js site/playground.js
          ls -la site
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
