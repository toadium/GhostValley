name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (pre-release)
        uses: hustcer/setup-moonbit@v1
        with:
          version: 'pre-release'

      - name: Print MoonBit Version
        run: |
          moon version --all
          echo "---"
          ls -la
          echo "---"
          cat moon.mod
          echo "---"
          find . -name "moon.pkg" -not -path "./.git/*" | head -10

      - name: Test (wasm-gc)
        run: |
          moon test --target wasm-gc 2>&1 || {
            echo "EXIT CODE: $?"
            echo "--- moon test failed, trying moon check ---"
            moon check --target wasm-gc 2>&1 || true
            exit 1
          }

      - name: Test (wasm)
        run: moon test --target wasm

      - name: Test (js)
        run: moon test --target js

      - name: Test (native)
        continue-on-error: true
        run: moon test --target native

      - name: Format check
        run: moon fmt --check
