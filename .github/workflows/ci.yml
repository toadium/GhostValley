name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format check
        run: moon fmt --check
      - name: Type check (strict)
        run: moon check --target all --warn-list +73 --deny-warn
      - name: Build (strict)
        run: moon build --target all --warn-list +73 --deny-warn
      - name: Docs consistency
        run: node scripts/check_docs.mjs
      - name: Qwen curated example smoke
        run: moon run examples/qwen_curated --target native --warn-list +73 --deny-warn
      - name: CLI smoke
        run: moon run cli --target native -- help

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm
          - wasm-gc
          - js
          - native
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - name: Test target
        run: moon test --target ${{ matrix.target }} --warn-list +73 --deny-warn

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coverage gate
        run: node scripts/check_coverage.mjs --min 97

  pages:
    name: Pages demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages check
        run: node scripts/check_pages.mjs

  bench:
    name: Bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - name: Run benchmark
        run: moon run bench --target native --release
