name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Debug — MoonBit Version & PATH
        run: |
          echo "PATH=$PATH"
          which moon || echo "moon not found"
          moon version --all || echo "moon version failed"

      - name: Debug — Project Structure
        run: |
          ls -la
          cat moon.mod

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Test (wasm)
        run: moon test --target wasm

      - name: Test (js)
        run: moon test --target js

      - name: Test (native)
        continue-on-error: true
        run: moon test --target native

      - name: Format check
        run: moon fmt --check
